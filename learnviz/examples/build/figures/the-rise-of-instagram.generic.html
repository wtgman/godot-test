      <p><strong>Main subject/content</strong>: The rise of Instagram. A vertical timeline. Events run from earliest at the top to latest at the bottom, joined by a single vertical line.</p><ul><li>October 2010: Launch, iPhone only. Photo sharing with filters, built for slow mobile connections. Twenty five thousand users on the first day.</li><li>April 2012: Acquired by Facebook for one billion US dollars. Thirteen employees, no revenue. The price was for the audience and the threat it posed.</li><li>June 2013: Video arrives. Fifteen second clips, a direct answer to Vine.</li><li>August 2016: Stories launches. Twenty four hour posts, copied openly from Snapchat. Within two years Stories had more daily users than Snapchat entirely.</li><li>June 2018: IGTV and one billion users. A push into long form video that never found an audience and was retired in 2022.</li><li>August 2020: Reels launches. Short vertical video, answering TikTok. The feed shifts from people you follow to what the algorithm picks.</li><li>2023 to 2025: Recommendation first. Most of what a user sees comes from accounts they do not follow. The product is now closer to television than to a friend list.</li></ul><p><strong>Important visual details</strong>: Each event is a dot on the line. Turning points are drawn as a larger dot with a ring around it.</p><p><strong>Relevant structure such as columns, layers, or groupings</strong>: 7 events, in chronological order. Each has a date, a heading, and a short explanation to the right of the line.</p><p><strong>Colours/layout</strong>: Drawn in the RMIT palette on a white background, with navy #000054 text. Accent colours in use: navy, teal, magenta, ochre, blue, rust. No information is carried by colour alone. Every coloured element also carries a number, a label or a texture, so nothing is lost in greyscale or by a learner with colour vision deficiency.</p><p><strong>Visible text</strong></p><ul><li>October 2010</li><li>Launch, iPhone only</li><li>April 2
