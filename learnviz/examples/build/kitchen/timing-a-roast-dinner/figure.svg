<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 411" width="960" height="411" role="img" aria-labelledby="lv-title lv-desc" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif"><title id="lv-title">A horizontal schedule chart. Time runs left to right along the top, measured in minutes from the start, from 0 to 105 titled &quot;Timing a roast dinner&quot;.</title><desc id="lv-desc">A horizontal schedule chart. Time runs left to right along the top, measured in minutes from the start, from 0 to 105. 6 rows, one per item. Bars that overlap vertically are happening at the same time. Lamb into the oven: starts at 0 minutes from the start, runs for 90, finishing at 90. Parboil the potatoes: starts at 45 minutes from the start, runs for 12, finishing at 57. Potatoes into the oven: starts at 60 minutes from the start, runs for 45, finishing at 105. Lamb out to rest: starts at 90 minutes from the start, runs for 15, finishing at 105. Make the gravy: starts at 92 minutes from the start, runs for 10, finishing at 102. Steam the beans: starts at 95 minutes from the start, runs for 8, finishing at 103.</desc><defs><pattern id="lv-diagonal" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8 L8,0 M-2,2 L2,-2 M6,10 L10,6" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><pattern id="lv-dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.55"/><circle cx="6" cy="6" r="1.4" fill="#ffffff" opacity="0.55"/></pattern><pattern id="lv-horizontal" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,2 H8 M0,6 H8" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><pattern id="lv-vertical" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M2,0 V8 M6,0 V8" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><pattern id="lv-grid" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,4 H8 M4,0 V8" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><marker id="lv-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#000054"/></marker></defs><rect width="960" height="411" fill="#ffffff"/><text x="36" y="57" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="21" font-weight="bold" fill="#000054">Timing a roast dinner</text><rect x="36" y="71" width="64" height="4" fill="#fac800"/><text x="188" y="113" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" font-weight="bold" fill="#000054">minutes from the start</text><line x1="188" y1="139" x2="188" y2="355" stroke="#d5d5dd" stroke-width="1"/><text x="188" y="129" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054" text-anchor="middle" opacity="0.85">0</text><line x1="310.67" y1="139" x2="310.67" y2="355" stroke="#d5d5dd" stroke-width="1"/><text x="310.67" y="129" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054" text-anchor="middle" opacity="0.85">20</text><line x1="433.33" y1="139" x2="433.33" y2="355" stroke="#d5d5dd" stroke-width="1"/><text x="433.33" y="129" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054" text-anchor="middle" opacity="0.85">40</text><line x1="556" y1="139" x2="556" y2="355" stroke="#d5d5dd" stroke-width="1"/><text x="556" y="129" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054" text-anchor="middle" opacity="0.85">60</text><line x1="678.67" y1="139" x2="678.67" y2="355" stroke="#d5d5dd" stroke-width="1"/><text x="678.67" y="129" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054" text-anchor="middle" opacity="0.85">80</text><line x1="801.33" y1="139" x2="801.33" y2="355" stroke="#d5d5dd" stroke-width="1"/><text x="801.33" y="129" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054" text-anchor="middle" opacity="0.85">100</text><line x1="924" y1="139" x2="924" y2="355" stroke="#d5d5dd" stroke-width="1"/><text x="924" y="129" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054" text-anchor="middle" opacity="0.85">120</text><g data-item="0"><text x="36" y="158.5" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" font-weight="bold" fill="#000054">Lamb into the oven</text><path d="M192,144 H736 A4,4 0 0 1 740,148 V160 A4,4 0 0 1 736,164 H192 A4,4 0 0 1 188,160 V148 A4,4 0 0 1 192,144 Z" fill="#000054"/><text x="195" y="158" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff">0 to 90</text></g><rect x="36" y="172" width="888" height="36" fill="#000054" opacity="0.04"/><g data-item="1"><text x="36" y="194.5" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" font-weight="bold" fill="#000054">Parboil the potatoes</text><path d="M468,180 H533.6 A4,4 0 0 1 537.6,184 V196 A4,4 0 0 1 533.6,200 H468 A4,4 0 0 1 464,196 V184 A4,4 0 0 1 468,180 Z" fill="#000054"/><text x="471" y="194" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff">45 to 57</text></g><g data-item="2"><text x="36" y="230.5" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" font-weight="bold" fill="#000054">Potatoes into the oven</text><path d="M560,216 H828 A4,4 0 0 1 832,220 V232 A4,4 0 0 1 828,236 H560 A4,4 0 0 1 556,232 V220 A4,4 0 0 1 560,216 Z" fill="#000054"/><text x="563" y="230" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff">60 to 