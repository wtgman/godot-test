<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 461.6" width="960" height="461.6" role="img" aria-labelledby="lv-title lv-desc" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif"><title id="lv-title">How five responses became five steps. A vertical timeline. Events run from earliest at the top to latest at the bottom, joined by a single vertical.</title><desc id="lv-desc">A vertical timeline. Events run from earliest at the top to latest at the bottom, joined by a single vertical line. 4 events, in chronological order. Each has a date, a heading, and a short explanation to the right of the line. 1969: On Death and Dying is published. Five responses observed in people who were facing their own death. 1970s and 1980s: Borrowed for bereavement, flattened into steps. Applied to grieving someone else&apos;s death, and taught as a sequence. 2005: Kübler-Ross says they are not a sequence. On Grief and Grieving: not stops on a linear timeline, and not everyone experiences all of them. Now: The five-step version is still the one most people arrive with. Which is why it is worth correcting before anything else is taught.</desc><defs><pattern id="lv-diagonal" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8 L8,0 M-2,2 L2,-2 M6,10 L10,6" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><pattern id="lv-dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.55"/><circle cx="6" cy="6" r="1.4" fill="#ffffff" opacity="0.55"/></pattern><pattern id="lv-horizontal" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,2 H8 M0,6 H8" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><pattern id="lv-vertical" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M2,0 V8 M6,0 V8" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><pattern id="lv-grid" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,4 H8 M4,0 V8" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><marker id="lv-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#000054"/></marker></defs><rect width="960" height="461.6" fill="#ffffff"/><text x="36" y="57" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="21" font-weight="bold" fill="#000054">How five responses became five steps</text><rect x="36" y="71" width="64" height="4" fill="#fac800"/><line x1="44" y1="109.9" x2="44" y2="357.85" stroke="#d5d5dd" stroke-width="3" stroke-linecap="round"/><g data-item="0"><circle cx="44" cy="109.9" r="10" fill="#ffffff"/><circle cx="44" cy="109.9" r="7" fill="#000054"/><text x="78" y="114.5" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" font-weight="bold" fill="#00706b">1969</text><text x="78" y="130.03" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="14.5" font-weight="bold" fill="#000054">On Death and Dying is published</text><text x="78" y="153.6" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">Five responses observed in people who were facing their own death.</text></g><g data-item="1"><circle cx="44" cy="192.55" r="14" fill="#ffffff"/><circle cx="44" cy="192.55" r="11" fill="#a4177c"/><circle cx="44" cy="192.55" r="15.5" fill="none" stroke="#a4177c" stroke-width="1.5" opacity="0.5"/><text x="78" y="197.15" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" font-weight="bold" fill="#00706b">1970s and 1980s</text><text x="78" y="212.68" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="14.5" font-weight="bold" fill="#000054">Borrowed for bereavement, flattened into steps</text><text x="78" y="236.25" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">Applied to grieving someone else&apos;s death, and taught as a sequence.</text></g><g data-item="2"><circle cx="44" cy="275.2" r="14" fill="#ffffff"/><circle cx="44" cy="275.2" r="11" fill="#a4177c"/><circle cx="44" cy="275.2" r="15.5" fill="none" stroke="#a4177c" stroke-width="1.5" opacity="0.5"/><text x="78" y="279.8" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" font-weight="bold" fill="#00706b">2005</text><text x="78" y="295.33" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="14.5" font-weight="bold" fill="#000054">Kübler-Ross says they are not a sequence</text><text x="78" y="318.9" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">On Grief and Grieving: not stops on a linear timeline, and not everyone experiences all of them.</text></g><g data-item="3"><circle cx="44" cy="357.85" r="10" fill="#ffffff"/><circle cx="44" cy="357.85" r="7" fill="#000054"/><text x="78" y="362.45" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" font-weight="bold" fill="#00706b">Now</text><text x="78" y="377.98" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="14.5" font-weight="bold" fill="#000054">The five-step version is still the one most people arrive with</text><text x="78" y="401.55" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">Which is why it is worth correcting before anything else is taught.</text></g></svg>