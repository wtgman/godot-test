<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 516.17" width="960" height="516.17" role="img" aria-labelledby="lv-title lv-desc" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif"><title id="lv-title">A comparison table with 5 criteria down the left and 3 items across the top titled &quot;The five responses, one at a time&quot;.</title><desc id="lv-desc">A comparison table with 5 criteria down the left and 3 items across the top. 5 rows, one per criterion. 3 columns, one per item: What it can sound like, What the person may need, What not to say. Read across a row to compare all items on one criterion, or down a column to see one item in full. Denial: What it can sound like, There has been a mistake. Get the tests done again. What the person may need, Time, and the information offered again later rather than pressed now. What not to say, You need to accept this. Anger: What it can sound like, Why did nobody pick this up sooner? Often aimed at whoever is in the room. What the person may need, To be heard without the anger being taken personally or argued down. What not to say, There is no point getting angry about it. Bargaining: What it can sound like, If I do everything right, will that change it? Often carries what if and if only. What the person may need, Honesty about what is and is not possible, given without stripping out hope. What not to say, That is not going to make any difference. Depression: What it can sound like, Little talk. Withdrawal from things that used to matter. What the person may need, Someone present rather than fixing it. Watch for risk and escalate to a supervisor. What not to say, Try to look on the bright side. Acceptance: What it can sound like, I want to get the house sorted out. Practical planning. What the person may need, Support to act on the decisions they have made themselves. What not to say, You are being so brave about it.</desc><defs><pattern id="lv-diagonal" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8 L8,0 M-2,2 L2,-2 M6,10 L10,6" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><pattern id="lv-dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.55"/><circle cx="6" cy="6" r="1.4" fill="#ffffff" opacity="0.55"/></pattern><pattern id="lv-horizontal" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,2 H8 M0,6 H8" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><pattern id="lv-vertical" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M2,0 V8 M6,0 V8" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><pattern id="lv-grid" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,4 H8 M4,0 V8" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><marker id="lv-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#000054"/></marker></defs><rect width="960" height="516.17" fill="#ffffff"/><text x="36" y="57" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="21" font-weight="bold" fill="#000054">The five responses, one at a time</text><rect x="36" y="71" width="64" height="4" fill="#fac800"/><path d="M163,97 H405 A6,6 0 0 1 411,103 V132.57 A6,6 0 0 1 405,138.57 H163 A6,6 0 0 1 157,132.57 V103 A6,6 0 0 1 163,97 Z" fill="#000054"/><text x="284" y="122.5" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="14.5" font-weight="bold" fill="#ffffff" text-anchor="middle">What it can sound like</text><path d="M419,97 H661 A6,6 0 0 1 667,103 V132.57 A6,6 0 0 1 661,138.57 H419 A6,6 0 0 1 413,132.57 V103 A6,6 0 0 1 419,97 Z" fill="#00706b"/><text x="540" y="122.5" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="14.5" font-weight="bold" fill="#ffffff" text-anchor="middle">What the person may need</text><path d="M675,97 H917 A6,6 0 0 1 923,103 V132.57 A6,6 0 0 1 917,138.57 H675 A6,6 0 0 1 669,132.57 V103 A6,6 0 0 1 675,97 Z" fill="#a4177c"/><text x="796" y="122.5" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="14.5" font-weight="bold" fill="#ffffff" text-anchor="middle">What not to say</text><rect x="36" y="141.57" width="888" height="57.1" fill="#f3f3f3"/><line x1="412" y1="145.57" x2="412" y2="194.68" stroke="#d5d5dd" stroke-width="1"/><line x1="668" y1="145.57" x2="668" y2="194.68" stroke="#d5d5dd" stroke-width="1"/><g data-item="0"><text x="47" y="174.35" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" font-weight="bold" fill="#000054">Denial</text><text x="167" y="165.58" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">There has been a mistake. Get the tests</text><text x="167" y="183.13" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">done again.</text><text x="423" y="165.58" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">Time, and the information offered again</text><text x="423" y="183.13" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">later rather than pressed now.</text><text x="679" y="174.35" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">You need to accept this.</text></g><line x1="412" y1="202.68" x2="412" y2="251.77" stroke="#d5d5dd" stroke-width="1"/><line x1="668" y1="202.68" x2="668" y2="251.77" stroke="#d5d5dd" stroke-width="1"/><g data-item="1"><text x="47" y="231.45" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" font-weight="bold" fill="#000054">Anger</text><text x="167" y="222.68" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">Why did nobody pick this up sooner?</text><text x="167" y="240.23" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">Often aimed at whoever is in the room.</text><text x="423" y="222.68" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">To be heard without the anger being</text><text x="423" y="240.23" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">taken personally or argued down.</text><text x="679" y="231.45" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">There is no point getting angry about it.</text></g><rect x="36" y="255.77" width="888" height="74.65" fill="#f3f3f3"/><line x1="412" y1="259.77" x2="412" y2="326.42" stroke="#d5d5dd" stroke-width="1"/><line x1="668" y1="259.77" x2="668" y2="326.42" stroke="#d5d5dd" stroke-width="1"/><g data-item="2"><text x="47" y="297.33" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" font-weight="bold" fill="#000054">Bargaining</text><text x="167" y="288.55" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">If I do everything right, will that change</text><text x="167" y="306.1" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">it? Often carries what if and if only.</text><text x="423" y="279.77" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">Honesty about what is and is not</text><text x="423" y="297.33" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">possible, given without stripping out</text><text x="423" y="314.88" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">hope.</text><text x="679" y="288.55" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">That is not going to make any</text><text x="679" y="306.1" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">difference.</text></g><line x1="412" y1="334.42" x2="412" y2="401.07" stroke="#d5d5dd" stroke-width="1"/><line x1="668" y1="334.42" x2="668" y2="401.07" stroke="#d5d5dd" stroke-width="1"/><g data-item="3"><text x="47" y="371.98" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" font-weight="bold" fill="#000054">Depression</text><text x="167" y="363.2" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">Little talk. Withdrawal from things that</text><text x="167" y="380.75" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">used to matter.</text><text x="423" y="354.42" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">Someone present rather than fixing it.</text><text x="423" y="371.98" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">Watch for risk and escalate to a</text><text x="423" y="389.53" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">supervisor.</text><text x="679" y="371.98" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">Try to look on the bright side.</text></g><rect x="36" y="405.07" width="888" height="57.1" fill="#f3f3f3"/><line x1="412" y1="409.07" x2="412" y2="458.17" stroke="#d5d5dd" stroke-width="1"/><line x1="668" y1="409.07" x2="668" y2="458.17" stroke="#d5d5dd" stroke-width="1"/><g data-item="4"><text x="47" y="437.85" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" font-weight="bold" fill="#000054">Acceptance</text><text x="167" y="429.07" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">I want to get the house sorted out.</text><text x="167" y="446.62" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">Practical planning.</text><text x="423" y="429.07" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">Support to act on the decisions they</text><text x="423" y="446.62" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">have made themselves.</text><text x="679" y="437.85" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">You are being so brave about it.</text></g><line x1="36" y1="462.17" x2="924" y2="462.17" stroke="#000054" stroke-width="1.5"/></svg>