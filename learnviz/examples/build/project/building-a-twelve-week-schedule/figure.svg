<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 597.05" width="960" height="597.05" role="img" aria-labelledby="lv-title lv-desc" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif"><title id="lv-title">Building a twelve week schedule. A horizontal schedule chart. Time runs left to right along the top, measured in weeks from project start, from 0 to.</title><desc id="lv-desc">A horizontal schedule chart. Time runs left to right along the top, measured in weeks from project start, from 0 to 12. 9 rows, one per item. Bars are coloured by group: Approvals, People, Site. Bars that overlap vertically are happening at the same time. Council permit: starts at 0 weeks from project start, runs for 6, finishing at 6 (Approvals). Soil testing: starts at 1 weeks from project start, runs for 2, finishing at 3 (Approvals). Recruit volunteers: starts at 2 weeks from project start, runs for 4, finishing at 6 (People). Volunteer induction: starts at 6 weeks from project start, runs for 1, finishing at 7 (People). Clear the ground: starts at 6 weeks from project start, runs for 2, finishing at 8 (Site). Build raised beds: starts at 8 weeks from project start, runs for 3, finishing at 11 (Site). Install irrigation: starts at 9 weeks from project start, runs for 2, finishing at 11 (Site). Lay paths: starts at 10 weeks from project start, runs for 2, finishing at 12 (Site). Planting day: starts at 11 weeks from project start, runs for 1, finishing at 12 (People).</desc><defs><pattern id="lv-diagonal" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8 L8,0 M-2,2 L2,-2 M6,10 L10,6" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><pattern id="lv-dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.55"/><circle cx="6" cy="6" r="1.4" fill="#ffffff" opacity="0.55"/></pattern><pattern id="lv-horizontal" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,2 H8 M0,6 H8" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><pattern id="lv-vertical" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M2,0 V8 M6,0 V8" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><pattern id="lv-grid" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,4 H8 M4,0 V8" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><marker id="lv-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#000054"/></marker></defs><rect width="960" height="597.05" fill="#ffffff"/><text x="36" y="57" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="21" font-weight="bold" fill="#000054">Building a twelve week schedule</text><rect x="36" y="71" width="64" height="4" fill="#fac800"/><text x="168" y="113" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" font-weight="bold" fill="#000054">weeks from project start</text><line x1="168" y1="139" x2="168" y2="463" stroke="#d5d5dd" stroke-width="1"/><text x="168" y="129" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054" text-anchor="middle" opacity="0.85">0</text><line x1="276" y1="139" x2="276" y2="463" stroke="#d5d5dd" stroke-width="1"/><text x="276" y="129" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054" text-anchor="middle" opacity="0.85">2</text><line x1="384" y1="139" x2="384" y2="463" stroke="#d5d5dd" stroke-width="1"/><text x="384" y="129" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054" text-anchor="middle" opacity="0.85">4</text><line x1="492" y1="139" x2="492" y2="463" stroke="#d5d5dd" stroke-width="1"/><text x="492" y="129" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054" text-anchor="middle" opacity="0.85">6</text><line x1="600" y1="139" x2="600" y2="463" stroke="#d5d5dd" stroke-width="1"/><text x="600" y="129" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054" text-anchor="middle" opacity="0.85">8</text><line x1="708" y1="139" x2="708" y2="463" stroke="#d5d5dd" stroke-width="1"/><text x="708" y="129" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054" text-anchor="middle" opacity="0.85">10</text><line x1="816" y1="139" x2="816" y2="463" stroke="#d5d5dd" stroke-width="1"/><text x="816" y="129" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054" text-anchor="middle" opacity="0.85">12</text><line x1="924" y1="139" x2="924" y2="463" stroke="#d5d5dd" stroke-width="1"/><text x="924" y="129" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054" text-anchor="middle" opacity="0.85">14</text><g data-item="0"><text x="36" y="158.5" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" font-weight="bold" fill="#000054">Council permit</text><path d="M172,144 H488 A4,4 0 0 1 492,148 V160 A4,4 0 0 1 488,164 H172 A4,4 0 0 1 168,160 V148 A4,4 0 0 1 172,144 Z" fill="#000054"/><text x="175" y="158" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff">0 to 6</text></g><rect x="36" y="172" width="888" height="36" fill="#000054" opacity="0.04"/><g data-item="1"><text x="36" y="194.5" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" font-weight="bold" fill="#000054">Soil testing</text><path d="M226,180 H326 A4,4 0 0 1 330,184 V196 A4,4 0 0 1 326,200 H226 A4,4 0 0 1 222,196 V184 A4,4 0 0 1 226,180 Z" fill="#000054"/><text x="229" y="194" font-family="Helvetica, Arial, &apos;Liberation Sans&