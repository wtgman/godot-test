ll="#ffffff">6 to 8</text></g><rect x="36" y="316" width="888" height="36" fill="#000054" opacity="0.04"/><g data-item="5"><text x="36" y="338.5" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" font-weight="bold" fill="#000054">Build raised beds</text><path d="M604,324 H758 A4,4 0 0 1 762,328 V340 A4,4 0 0 1 758,344 H604 A4,4 0 0 1 600,340 V328 A4,4 0 0 1 604,324 Z" fill="#a4177c"/><path d="M604,324 H758 A4,4 0 0 1 762,328 V340 A4,4 0 0 1 758,344 H604 A4,4 0 0 1 600,340 V328 A4,4 0 0 1 604,324 Z" fill="url(#lv-dots)"/><text x="607" y="338" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff">8 to 11</text></g><g data-item="6"><text x="36" y="374.5" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" font-weight="bold" fill="#000054">Install irrigation</text><path d="M658,360 H758 A4,4 0 0 1 762,364 V376 A4,4 0 0 1 758,380 H658 A4,4 0 0 1 654,376 V364 A4,4 0 0 1 658,360 Z" fill="#a4177c"/><path d="M658,360 H758 A4,4 0 0 1 762,364 V376 A4,4 0 0 1 758,380 H658 A4,4 0 0 1 654,376 V364 A4,4 0 0 1 658,360 Z" fill="url(#lv-dots)"/><text x="661" y="374" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff">9 to 11</text></g><rect x="36" y="388" width="888" height="36" fill="#000054" opacity="0.04"/><g data-item="7"><text x="36" y="410.5" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" font-weight="bold" fill="#000054">Lay paths</text><path d="M712,396 H812 A4,4 0 0 1 816,400 V412 A4,4 0 0 1 812,416 H712 A4,4 0 0 1 708,412 V400 A4,4 0 0 1 712,396 Z" fill="#a4177c"/><path d="M712,396 H812 A4,4 0 0 1 816,400 V412 A4,4 0 0 1 812,416 H712 A4,4 0 0 1 708,412 V400 A4,4 0 0 1 712,396 Z" fill="url(#lv-dots)"/><text x="715" y="410" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff">10 to 12</text></g><g data-item="8"><text x="36" y="446.5" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" font-weight="bold" fill="#000054">Planting day</text><path d="M766,432 H812 A4,4 0 0 1 816,436 V448 A4,4 0 0 1 812,452 H766 A4,4 0 0 1 762,448 V436 A4,4 0 0 1 766,432 Z" fill="#00706b"/><path d="M766,432 H812 A4,4 0 0 1 816,436 V448 A4,4 0 0 1 812,452 H766 A4,4 0 0 1 762,448 V436 A4,4 0 0 1 766,432 Z" fill="url(#lv-diagonal)"/><text x="822" y="446" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054" opacity="0.8">11 to 12</text></g><line x1="492" y1="135" x2="492" y2="467" stroke="#a4177c" stroke-width="2" stroke-dasharray="5 4"/><polygon points="492,138 487,131 497,131" fill="#a4177c"/><line x1="816" y1="135" x2="816" y2="467" stroke="#a4177c" stroke-width="2" stroke-dasharray="5 4"/><polygon points="816,138 811,131 821,131" fill="#a4177c"/><polygon points="41,481.5 36,488.5 46,488.5" fill="#a4177c"/><text x="50" y="490.5" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054">6 weeks from project start: Permit granted, site work can start</text><polygon points="41,501.03 36,508.03 46,508.03" fill="#a4177c"/><text x="50" y="510.03" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054">12 weeks from project start: Handover to the volunteer committee</text><rect x="36" y="528.05" width="13" height="13" rx="2.5" fill="#000054"/><text x="57" y="539.05" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054">Approvals</text><rect x="130.13" y="528.05" width="13" height="13" rx="2.5" fill="#00706b"/><rect x="130.13" y="528.05" width="13" height="13" rx="2.5" fill="url(#lv-diagonal)"/><text x="151.13" y="539.05" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054">People</text><rect x="208.93" y="528.05" width="13" height="13" rx="2.5" fill="#a4177c"/><rect x="208.93" y="528.05" width="13" height="13" rx="2.5" fill="url(#lv-dots)"/><text x="229.93" y="539.05" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054">Site</text></svg>