<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 544.25" width="960" height="544.25" role="img" aria-labelledby="lv-title lv-desc" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif"><title id="lv-title">A vertical timeline. Events run from earliest at the top to latest at the bottom, joined by a single vertical line titled &quot;How Instagram grew&quot;.</title><desc id="lv-desc">A vertical timeline. Events run from earliest at the top to latest at the bottom, joined by a single vertical line. 5 events, in chronological order. Each has a date, a heading, and a short explanation to the right of the line. October 2010: Launch, iPhone only. Photo sharing with filters, built for slow mobile connections. April 2012: Facebook agrees to buy it for about US$1 billion. Thirteen staff and no revenue. Worth about US$715 million by the close. June 2013: Video arrives. Fifteen second clips, a direct answer to Vine. August 2016: Stories launches. Twenty four hour posts, copied openly from Snapchat. August 2020: Reels launches. Short vertical video, answering TikTok. The feed shifts toward what the algorithm picks.</desc><defs><pattern id="lv-diagonal" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8 L8,0 M-2,2 L2,-2 M6,10 L10,6" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><pattern id="lv-dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.55"/><circle cx="6" cy="6" r="1.4" fill="#ffffff" opacity="0.55"/></pattern><pattern id="lv-horizontal" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,2 H8 M0,6 H8" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><pattern id="lv-vertical" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M2,0 V8 M6,0 V8" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><pattern id="lv-grid" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,4 H8 M4,0 V8" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><marker id="lv-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#000054"/></marker></defs><rect width="960" height="544.25" fill="#ffffff"/><text x="36" y="57" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="21" font-weight="bold" fill="#000054">How Instagram grew</text><rect x="36" y="71" width="64" height="4" fill="#fac800"/><line x1="44" y1="109.9" x2="44" y2="440.5" stroke="#d5d5dd" stroke-width="3" stroke-linecap="round"/><g data-item="0"><circle cx="44" cy="109.9" r="10" fill="#ffffff"/><circle cx="44" cy="109.9" r="7" fill="#000054"/><text x="78" y="114.5" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" font-weight="bold" fill="#00706b">October 2010</text><text x="78" y="130.03" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="14.5" font-weight="bold" fill="#000054">Launch, iPhone only</text><text x="78" y="153.6" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">Photo sharing with filters, built for slow mobile connections.</text></g><g data-item="1"><circle cx="44" cy="192.55" r="14" fill="#ffffff"/><circle cx="44" cy="192.55" r="11" fill="#a4177c"/><circle cx="44" cy="192.55" r="15.5" fill="none" stroke="#a4177c" stroke-width="1.5" opacity="0.5"/><text x="78" y="197.15" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" font-weight="bold" fill="#00706b">April 2012</text><text x="78" y="212.68" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="14.5" font-weight="bold" fill="#000054">Facebook agrees to buy it for about US$1 billion</text><text x="78" y="236.25" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">Thirteen staff and no revenue. Worth about US$715 million by the close.</text></g><g data-item="2"><circle cx="44" cy="275.2" r="10" fill="#ffffff"/><circle cx="44" cy="275.2" r="7" fill="#000054"/><text x="78" y="279.8" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" font-weight="bold" fill="#00706b">June 2013</text><text x="78" y="295.33" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="14.5" font-weight="bold" fill="#000054">Video arrives</text><text x="78" y="318.9" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">Fifteen second clips, a direct answer to Vine.</text></g><g data-item="3"><circle cx="44" cy="357.85" r="14" fill="#ffffff"/><circle cx="44" cy="357.85" r="11" fill="#a4177c"/><circle cx="44" cy="357.85" r="15.5" fill="none" stroke="#a4177c" stroke-width="1.5" opacity="0.5"/><text x="78" y="362.45" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" font-weight="bold" fill="#00706b">August 2016</text><text x="78" y="377.98" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="14.5" font-weight="bold" fill="#000054">Stories launches</text><text x="78" y="401.55" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">Twenty four hour posts, copied openly from Snapchat.</text></g><g data-item="4"><circle cx="44" cy="440.5" r="14" fill="#ffffff"/><circle cx="44" cy="440.5" r="11" fill="#a4177c"/><circle cx="44" cy="440.5" r="15.5" fill="none" stroke="#a4177c" stroke-width="1.5" opacity="0.5"/><text x="78" y="445.1" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" font-weight="bold" fill="#00706b">August 2020</text><text x="78" y="460.63" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="14.5" font-weight="bold" fill="#000054">Reels launches</text><text x="78" y="484.2" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">Short vertical video, answering TikTok. The feed shifts toward what the algorithm picks.</text></g></svg>