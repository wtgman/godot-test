<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 473.15" width="960" height="473.15" role="img" aria-labelledby="lv-title lv-desc" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif"><title id="lv-title">A panel of 4 large figures, each in its own tile titled &quot;What was Instagram earning?&quot;.</title><desc id="lv-desc">A panel of 4 large figures, each in its own tile. 4 tiles in a grid 2 across, read left to right then down. US$1bn: Announced price, April 2012. Cash and Facebook shares. 13: Employees at the time of sale. $0: Revenue at the time of sale. No advertising, no subscriptions. 30m: Registered users at the time. Registered accounts, not monthly active users.</desc><defs><pattern id="lv-diagonal" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8 L8,0 M-2,2 L2,-2 M6,10 L10,6" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><pattern id="lv-dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.55"/><circle cx="6" cy="6" r="1.4" fill="#ffffff" opacity="0.55"/></pattern><pattern id="lv-horizontal" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,2 H8 M0,6 H8" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><pattern id="lv-vertical" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M2,0 V8 M6,0 V8" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><pattern id="lv-grid" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,4 H8 M4,0 V8" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><marker id="lv-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#000054"/></marker></defs><rect width="960" height="473.15" fill="#ffffff"/><text x="36" y="57" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="21" font-weight="bold" fill="#000054">What was Instagram earning?</text><rect x="36" y="71" width="64" height="4" fill="#fac800"/><g data-item="0"><path d="M44,97 H463 A8,8 0 0 1 471,105 V240.08 A8,8 0 0 1 463,248.08 H44 A8,8 0 0 1 36,240.08 V105 A8,8 0 0 1 44,97 Z" fill="#f3f3f3"/><path d="M41,97 H466 A5,5 0 0 1 471,102 V102 A5,5 0 0 1 466,107 H41 A5,5 0 0 1 36,102 V102 A5,5 0 0 1 41,97 Z" fill="#000054"/><rect x="36" y="102" width="435" height="5" fill="#f3f3f3"/><text x="56" y="165.68" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="56" font-weight="bold" fill="#000054">US$1bn</text><text x="56" y="190" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" font-weight="bold" fill="#000054">Announced price, April 2012</text><g opacity="0.85"><text x="56" y="214.55" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054">Cash and Facebook shares.</text></g></g><g data-item="1"><path d="M497,97 H916 A8,8 0 0 1 924,105 V240.08 A8,8 0 0 1 916,248.08 H497 A8,8 0 0 1 489,240.08 V105 A8,8 0 0 1 497,97 Z" fill="#f3f3f3"/><path d="M494,97 H919 A5,5 0 0 1 924,102 V102 A5,5 0 0 1 919,107 H494 A5,5 0 0 1 489,102 V102 A5,5 0 0 1 494,97 Z" fill="#00706b"/><rect x="489" y="102" width="435" height="5" fill="#f3f3f3"/><text x="509" y="165.68" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="56" font-weight="bold" fill="#00706b">13</text><text x="509" y="190" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" font-weight="bold" fill="#000054">Employees at the time of sale</text></g><g data-item="2"><path d="M44,266.08 H463 A8,8 0 0 1 471,274.08 V409.15 A8,8 0 0 1 463,417.15 H44 A8,8 0 0 1 36,409.15 V274.08 A8,8 0 0 1 44,266.08 Z" fill="#f3f3f3"/><path d="M41,266.08 H466 A5,5 0 0 1 471,271.08 V271.08 A5,5 0 0 1 466,276.08 H41 A5,5 0 0 1 36,271.08 V271.08 A5,5 0 0 1 41,266.08 Z" fill="#a4177c"/><rect x="36" y="271.08" width="435" height="5" fill="#f3f3f3"/><text x="56" y="334.76" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="56" font-weight="bold" fill="#a4177c">$0</text><text x="56" y="359.08" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" font-weight="bold" fill="#000054">Revenue at the time of sale</text><g opacity="0.85"><text x="56" y="383.63" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054">No advertising, no subscriptions.</text></g></g><g data-item="3"><path d="M497,266.08 H916 A8,8 0 0 1 924,274.08 V409.15 A8,8 0 0 1 916,417.15 H497 A8,8 0 0 1 489,409.15 V274.08 A8,8 0 0 1 497,266.08 Z" fill="#f3f3f3"/><path d="M494,266.08 H919 A5,5 0 0 1 924,271.08 V271.08 A5,5 0 0 1 919,276.08 H494 A5,5 0 0 1 489,271.08 V271.08 A5,5 0 0 1 494,266.08 Z" fill="#8a5a00"/><rect x="489" y="271.08" width="435" height="5" fill="#f3f3f3"/><text x="509" y="334.76" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="56" font-weight="bold" fill="#8a5a00">30m</text><text x="509" y="359.08" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" font-weight="bold" fill="#000054">Registered users at the time</text><g opacity="0.85"><text x="509" y="383.63" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054">Registered accounts, not monthly active users.</text></g></g></svg>