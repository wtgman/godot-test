<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 693.2" width="960" height="693.2" role="img" aria-labelledby="lv-title lv-desc" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif"><title id="lv-title">Community garden build, twelve week schedule. A horizontal schedule chart. Time runs left to right along the top, measured in weeks from project.</title><desc id="lv-desc">A horizontal schedule chart. Time runs left to right along the top, measured in weeks from project start, from 0 to 12. 9 rows, one per item. Bars are coloured by group: Approvals, People, Site. Bars that overlap vertically are happening at the same time. Council permit: starts at 0 weeks from project start, runs for 6, finishing at 6 (Approvals). Six weeks is the statutory maximum and nothing on site can begin without it. This is the critical path. Soil testing: starts at 1 weeks from project start, runs for 2, finishing at 3 (Approvals). Recruit volunteers: starts at 2 weeks from project start, runs for 4, finishing at 6 (People). Volunteer induction: starts at 6 weeks from project start, runs for 1, finishing at 7 (People). Cannot run before recruitment closes, and must finish before anyone is on site. Clear the ground: starts at 6 weeks from project start, runs for 2, finishing at 8 (Site). Build raised beds: starts at 8 weeks from project start, runs for 3, finishing at 11 (Site). Install irrigation: starts at 9 weeks from project start, runs for 2, finishing at 11 (Site). Overlaps the bed build deliberately, because the plumber is only available in week 9. Lay paths: starts at 10 weeks from project start, runs for 2, finishing at 12 (Site). Planting day: starts at 11 weeks from project start, runs for 1, finishing at 12 (People).</desc><defs><pattern id="lv-diagonal" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8 L8,0 M-2,2 L2,-2 M6,10 L10,6" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><pattern id="lv-dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.55"/><circle cx="6" cy="6" r="1.4" fill="#ffffff" opacity="0.55"/></pattern><pattern id="lv-horizontal" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,2 H8 M0,6 H8" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><pattern id="lv-vertical" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M2,0 V8 M6,0 V8" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><pattern id="lv-grid" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,4 H8 M4,0 V8" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><marker id="lv-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#000054"/></marker></defs><rect width="960" height="693.2" fill="#ffffff"/><text x="36" y="57" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="21" font-weight="bold" fill="#000054">Community garden build, twelve week schedule</text><text x="36" y="81.5" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="14.5" fill="#000054">Three workstreams running at once. The dependencies are what make the schedule tight, not the total effort.</text><rect x="36" y="100.58" width="64" height="4" fill="#fac800"/><text x="168" y="142.57" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" font-weight="bold" fill="#000054">weeks from project start</text><line x1="168" y1="168.58" x2="168" y2="492.58" stroke="#d5d5dd" stroke-width="1"/><text x="168" y="158.57" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054" text-anchor="middle" opacity="0.85">0</text><line x1="276" y1="168.58" x2="276" y2="492.58" stroke="#d5d5dd" stroke-width="1"/><text x="276" y="158.57" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054" text-anchor="middle" opacity="0.85">2</text><line x1="384" y1="168.58" x2="384" y2="492.58" stroke="#d5d5dd" stroke-width="1"/><text x="384" y="158.57" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054" text-anchor="middle" opacity="0.85">4</text><line x1="492" y1="168.58" x2="492" y2="492.58" stroke="#d5d5dd" stroke-width="1"/><text x="492" y="158.57" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054" text-anchor="middle" opacity="0.85">6</text><line x1="600" y1="168.58" x2="600" y2="492.58" stroke="#d5d5dd" stroke-width="1"/><text x="600" y="158.57" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054" text-anchor="middle" opacity="0.85">8</text><line x1="708" y1="168.58" x2="708" y2="492.58" stroke="#d5d5dd" stroke-width="1"/><text x="708" y="158.57" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054" text-anchor="middle" opacity="0.85">10</text><line x1="816" y1="168.58" x2="816" y2="492.58" stroke="#d5d5dd" stroke-width="1"/><text x="816" y="158.57" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054" text-anchor="middle" opacity="0.85">12</text><line x1="924" y1="168.58" x2="924" y2="492.58" stroke="#d5d5dd" stroke-width="1"/><text x="924" y="158.57" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054" text-anchor="middle" opacity="0.85">14</text><text x="36" y="188.08" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" font-weight="bold" fill="#000054">Council permit</text><path d="M172,173.58 H488 A4,4 0 0 1 492,177.58 V189.58 A4,4 0 0 1 488,193.58 H172 A4,4 0 0 1 168,189.58 V177.58 A4,4 0 0 1 172,173.58 Z" fill="#000054"/><text x="175" y="187.58" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff">0 to 6</text><rect x="36" y="201.58" width="888" height="36" fill="#000054" opacity="0.04"/><text x="36" y="224.08" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" font-weight="bold" fill="#000054">Soil testing</text><path d="M226,209.58 H326 A4,4 0 0 1 330,213.58 V225.58 A4,4 0 0 1 326,229.58 H226 A4,4 0 0 1 222,225.58 V213.58 A4,4 0 0 1 226,209.58 Z" fill="#000054"/><text x="229" y="223.58" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff">1 to 3</text><text x="36" y="260.08" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" font-weight="bold" fill="#000054">Recruit volunteers</text><path d="M280,245.58 H488 A4,4 0 0 1 492,249.58 V261.58 A4,4 0 0 1 488,265.58 H280 A4,4 0 0 1 276,261.58 V249.58 A4,4 0 0 1 280,245.58 Z" fill="#00706b"/><path d="M280,245.58 H488 A4,4 0 0 1 492,249.58 V261.58 A4,4 0 0 1 488,265.58 H280 A4,4 0 0 1 276,261.58 V249.58 A4,4 0 0 1 280,245.58 Z" fill="url(#lv-diagonal)"/><text x="283" y="259.58" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff">2 to 6</text><rect x="36" y="273.58" width="888" height="36" fill="#000054" opacity="0.04"/><text x="36" y="296.08" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" font-weight="bold" fill="#000054">Volunteer induction</text><path d="M496,281.58 H542 A4,4 0 0 1 546,285.58 V297.58 A4,4 0 0 1 542,301.58 H496 A4,4 0 0 1 492,297.58 V285.58 A4,4 0 0 1 496,281.58 Z" fill="#00706b"/><path d="M496,281.58 H542 A4,4 0 0 1 546,285.58 V297.58 A4,4 0 0 1 542,301.58 H496 A4,4 0 0 1 492,297.58 V285.58 A4,4 0 0 1 496,281.58 Z" fill="url(#lv-diagonal)"/><text x="499" y="295.58" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff">6 to 7</text><text x="36" y="332.08" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" font-weight="bold" fill="#000054">Clear the ground</text><path d="M496,317.58 H596 A4,4 0 0 1 600,321.58 V333.58 A4,4 0 0 1 596,337.58 H496 A4,4 0 0 1 492,333.58 V321.58 A4,4 0 0 1 496,317.58 Z" fill="#a4177c"/><path d="M496,317.58 H596 A4,4 0 0 1 600,321.58 V333.58 A4,4 0 0 1 596,337.58 H496 A4,4 0 0 1 492,333.58 V321.58 A4,4 0 0 1 496,317.58 Z" fill="url(#lv-dots)"/><text x="499" y="331.58" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff">6 to 8</text><rect x="36" y="345.58" width="888" height="36" fill="#000054" opacity="0.04"/><text x="36" y="368.08" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" font-weight="bold" fill="#000054">Build raised beds</text><path d="M604,353.58 H758 A4,4 0 0 1 762,357.58 V369.58 A4,4 0 0 1 758,373.58 H604 A4,4 0 0 1 600,369.58 V357.58 A4,4 0 0 1 604,353.58 Z" fill="#a4177c"/><path d="M604,353.58 H758 A4,4 0 0 1 762,357.58 V369.58 A4,4 0 0 1 758,373.58 H604 A4,4 0 0 1 600,369.58 V357.58 A4,4 0 0 1 604,353.58 Z" fill="url(#lv-dots)"/><text x="607" y="367.58" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff">8 to 11</text><text x="36" y="404.08" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" font-weight="bold" fill="#000054">Install irrigation</text><path d="M658,389.58 H758 A4,4 0 0 1 762,393.58 V405.58 A4,4 0 0 1 758,409.58 H658 A4,4 0 0 1 654,405.58 V393.58 A4,4 0 0 1 658,389.58 Z" fill="#a4177c"/><path d="M658,389.58 H758 A4,4 0 0 1 762,393.58 V405.58 A4,4 0 0 1 758,409.58 H658 A4,4 0 0 1 654,405.58 V393.58 A4,4 0 0 1 658,389.58 Z" fill="url(#lv-dots)"/><text x="661" y="403.58" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff">9 to 11</text><rect x="36" y="417.58" width="888" height="36" fill="#000054" opacity="0.04"/><text x="36" y="440.08" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" font-weight="bold" fill="#000054">Lay paths</text><path d="M712,425.58 H812 A4,4 0 0 1 816,429.58 V441.58 A4,4 0 0 1 812,445.58 H712 A4,4 0 0 1 708,441.58 V429.58 A4,4 0 0 1 712,425.58 Z" fill="#a4177c"/><path d="M712,425.58 H812 A4,4 0 0 1 816,429.58 V441.58 A4,4 0 0 1 812,445.58 H712 A4,4 0 0 1 708,441.58 V429.58 A4,4 0 0 1 712,425.58 Z" fill="url(#lv-dots)"/><text x="715" y="439.58" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff">10 to 12</text><text x="36" y="476.08" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" font-weight="bold" fill="#000054">Planting day</text><path d="M766,461.58 H812 A4,4 0 0 1 816,465.58 V477.58 A4,4 0 0 1 812,481.58 H766 A4,4 0 0 1 762,477.58 V465.58 A4,4 0 0 1 766,461.58 Z" fill="#00706b"/><path d="M766,461.58 H812 A4,4 0 0 1 816,465.58 V477.58 A4,4 0 0 1 812,481.58 H766 A4,4 0 0 1 762,477.58 V465.58 A4,4 0 0 1 766,461.58 Z" fill="url(#lv-diagonal)"/><text x="822" y="475.58" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054" opacity="0.8">11 to 12</text><line x1="492" y1="164.58" x2="492" y2="496.58" stroke="#a4177c" stroke-width="2" stroke-dasharray="5 4"/><polygon points="492,163.57 487,155.57 497,155.57" fill="#a4177c"/><line x1="816" y1="164.58" x2="816" y2="496.58" stroke="#a4177c" stroke-width="2" stroke-dasharray="5 4"/><polygon points="816,163.57 811,155.57 821,155.57" fill="#a4177c"/><polygon points="41,511.08 36,518.08 46,518.08" fill="#a4177c"/><text x="50" y="520.08" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054">6 weeks from project start: Permit granted, site work can start</text><polygon points="41,530.6 36,537.6 46,537.6" fill="#a4177c"/><text x="50" y="539.6" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054">12 weeks from project start: Handover to the volunteer committee</text><rect x="36" y="557.63" width="13" height="13" rx="2.5" fill="#000054"/><text x="57" y="568.63" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054">Approvals</text><rect x="130.13" y="557.63" width="13" height="13" rx="2.5" fill="#00706b"/><rect x="130.13" y="557.63" width="13" height="13" rx="2.5" fill="url(#lv-diagonal)"/><text x="151.13" y="568.63" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054">People</text><rect x="208.93" y="557.63" width="13" height="13" rx="2.5" fill="#a4177c"/><rect x="208.93" y="557.63" width="13" height="13" rx="2.5" fill="url(#lv-dots)"/><text x="229.93" y="568.63" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054">Site</text><g opacity="0.85"><text x="36" y="600.13" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054">Council permit: Six weeks is the statutory maximum and nothing on site can begin without it. This is the critical path.</text></g><g opacity="0.85"><text x="36" y="619.65" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054">Volunteer induction: Cannot run before recruitment closes, and must finish before anyone is on site.</text></g><g opacity="0.85"><text x="36" y="639.17" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054">Install irrigation: Overlaps the bed build deliberately, because the plumber is only available in week 9.</text></g></svg>