<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 555.3" width="960" height="555.3" role="img" aria-labelledby="lv-title lv-desc" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif"><title id="lv-title">A panel of 4 large figures, each in its own tile titled &quot;The Instagram acquisition, in four numbers&quot;.</title><desc id="lv-desc">A panel of 4 large figures, each in its own tile. 4 tiles in a grid 2 across, read left to right then down. $1bn: Paid by Facebook in April 2012. In US dollars, for a company that had never charged anyone anything. 13: Employees at the time of sale. About 77 million US dollars per head. $0: Revenue at the time of sale. No advertising, no subscriptions, no marketplace. 18: Months from launch to acquisition. October 2010 to April 2012.</desc><defs><pattern id="lv-diagonal" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8 L8,0 M-2,2 L2,-2 M6,10 L10,6" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><pattern id="lv-dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.55"/><circle cx="6" cy="6" r="1.4" fill="#ffffff" opacity="0.55"/></pattern><pattern id="lv-horizontal" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,2 H8 M0,6 H8" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><pattern id="lv-vertical" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M2,0 V8 M6,0 V8" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><pattern id="lv-grid" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,4 H8 M4,0 V8" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><marker id="lv-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#000054"/></marker></defs><rect width="960" height="555.3" fill="#ffffff"/><text x="36" y="57" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="21" font-weight="bold" fill="#000054">The Instagram acquisition, in four numbers</text><text x="36" y="81.5" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="14.5" fill="#000054">The same story as the timeline, told so the figures land as figures.</text><rect x="36" y="100.58" width="64" height="4" fill="#fac800"/><path d="M44,126.58 H463 A8,8 0 0 1 471,134.57 V269.65 A8,8 0 0 1 463,277.65 H44 A8,8 0 0 1 36,269.65 V134.57 A8,8 0 0 1 44,126.58 Z" fill="#f3f3f3"/><path d="M41,126.58 H466 A5,5 0 0 1 471,131.57 V131.57 A5,5 0 0 1 466,136.57 H41 A5,5 0 0 1 36,131.57 V131.57 A5,5 0 0 1 41,126.58 Z" fill="#000054"/><rect x="36" y="131.57" width="435" height="5" fill="#f3f3f3"/><text x="56" y="195.26" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="56" font-weight="bold" fill="#000054">$1bn</text><text x="56" y="219.58" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" font-weight="bold" fill="#000054">Paid by Facebook in April 2012</text><g opacity="0.85"><text x="56" y="244.13" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054">In US dollars, for a company that had never charged anyone anything.</text></g><path d="M497,126.58 H916 A8,8 0 0 1 924,134.57 V269.65 A8,8 0 0 1 916,277.65 H497 A8,8 0 0 1 489,269.65 V134.57 A8,8 0 0 1 497,126.58 Z" fill="#f3f3f3"/><path d="M494,126.58 H919 A5,5 0 0 1 924,131.57 V131.57 A5,5 0 0 1 919,136.57 H494 A5,5 0 0 1 489,131.57 V131.57 A5,5 0 0 1 494,126.58 Z" fill="#00706b"/><rect x="489" y="131.57" width="435" height="5" fill="#f3f3f3"/><text x="509" y="195.26" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="56" font-weight="bold" fill="#00706b">13</text><text x="509" y="219.58" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" font-weight="bold" fill="#000054">Employees at the time of sale</text><g opacity="0.85"><text x="509" y="244.13" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054">About 77 million US dollars per head.</text></g><path d="M44,295.65 H463 A8,8 0 0 1 471,303.65 V438.73 A8,8 0 0 1 463,446.73 H44 A8,8 0 0 1 36,438.73 V303.65 A8,8 0 0 1 44,295.65 Z" fill="#f3f3f3"/><path d="M41,295.65 H466 A5,5 0 0 1 471,300.65 V300.65 A5,5 0 0 1 466,305.65 H41 A5,5 0 0 1 36,300.65 V300.65 A5,5 0 0 1 41,295.65 Z" fill="#a4177c"/><rect x="36" y="300.65" width="435" height="5" fill="#f3f3f3"/><text x="56" y="364.33" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="56" font-weight="bold" fill="#a4177c">$0</text><text x="56" y="388.65" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" font-weight="bold" fill="#000054">Revenue at the time of sale</text><g opacity="0.85"><text x="56" y="413.2" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054">No advertising, no subscriptions, no marketplace.</text></g><path d="M497,295.65 H916 A8,8 0 0 1 924,303.65 V438.73 A8,8 0 0 1 916,446.73 H497 A8,8 0 0 1 489,438.73 V303.65 A8,8 0 0 1 497,295.65 Z" fill="#f3f3f3"/><path d="M494,295.65 H919 A5,5 0 0 1 924,300.65 V300.65 A5,5 0 0 1 919,305.65 H494 A5,5 0 0 1 489,300.65 V300.65 A5,5 0 0 1 494,295.65 Z" fill="#8a5a00"/><rect x="489" y="300.65" width="435" height="5" fill="#f3f3f3"/><text x="509" y="364.33" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="56" font-weight="bold" fill="#8a5a00">18</text><text x="509" y="388.65" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" font-weight="bold" fill="#000054">Months from launch to acquisition</text><g opacity="0.85"><text x="509" y="413.2" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054">October 2010 to April 2012.</text></g><text x="36" y="478.23" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054">The price was not paid for the business. It was paid for the audience, and for stopping a competitor owning it. That is the point of the lesson, and it is why revenue is the most</text><text x="36" y="493.75" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054">useful number on this panel.</text><g opacity="0.75"><text x="36" y="515.28" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054">Source: Company announcements, April 2012. Figures also used in the accompanying timeline. Verify against your unit&apos;s prescribed text before use.</text></g></svg>