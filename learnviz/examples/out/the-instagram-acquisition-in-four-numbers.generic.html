      <p><strong>Main subject/content</strong>: The Instagram acquisition, in four numbers. A panel of 4 large figures, each in its own tile.</p><ul><li>$1bn: Paid by Facebook in April 2012. In US dollars, for a company that had never charged anyone anything.</li><li>13: Employees at the time of sale. About 77 million US dollars per head.</li><li>$0: Revenue at the time of sale. No advertising, no subscriptions, no marketplace.</li><li>18: Months from launch to acquisition. October 2010 to April 2012.</li></ul><p><strong>Important visual details</strong>: Each tile is a light grey rounded box with a coloured bar across the top. The figure is set large in that colour, with a bold caption underneath saying what it counts.</p><p><strong>Relevant structure such as columns, layers, or groupings</strong>: 4 tiles in a grid 2 across, read left to right then down.</p><p><strong>Colours/layout</strong>: Drawn in the RMIT palette on a white background, with navy #000054 text. Accent colours in use: navy, teal, magenta, ochre. No information is carried by colour alone. Every coloured element also carries a number, a label or a texture, so nothing is lost in greyscale or by a learner with colour vision deficiency. The price was not paid for the business. It was paid for the audience, and for stopping a competitor owning it. That is the point of the lesson, and it is why revenue is the most useful number on this panel.</p><p><strong>Visible text</strong></p><ul><li>$1bn</li><li>Paid by Facebook in April 2012</li><li>In US dollars, for a company that had never charged anyone anything.</li><li>13</li><li>Employees at the time of sale</li><li>About 77 million US dollars per head.</li><li>$0</li><li>Revenue at the time of sale</li><li>No advertising, no subscriptions, no marketplace.</li><li>18</li><li>Months from launch to acquisition</li><li>October 2010 to April 2012.</li></ul>
