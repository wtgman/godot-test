<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 613.85" width="960" height="613.85" role="img" aria-labelledby="lv-title lv-desc" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif"><title id="lv-title">A comparison table with 5 criteria down the left and 3 items across the top titled &quot;Recognising the five grief responses in what someone says&quot;.</title><desc id="lv-desc">A comparison table with 5 criteria down the left and 3 items across the top. 5 rows, one per criterion. 3 columns, one per item: What it can sound like, What the person may need, What not to say. Read across a row to compare all items on one criterion, or down a column to see one item in full. Denial: What it can sound like, There has been a mistake. Get the tests done again. What the person may need, Time, and the information offered again later rather than pressed now. What not to say, You need to accept this. Anger: What it can sound like, Why did nobody pick this up sooner? Often aimed at whoever is in the room. What the person may need, To be heard without the anger being taken personally or argued down. What not to say, There is no point getting angry about it. Bargaining: What it can sound like, If I do everything right, will that change it? Often carries what if and if only. What the person may need, Honesty about what is and is not possible, given without stripping out hope. What not to say, That is not going to make any difference. Depression: What it can sound like, Little talk. Withdrawal from things that used to matter. What the person may need, Someone present rather than fixing it. Watch for risk and escalate to a supervisor. What not to say, Try to look on the bright side. Acceptance: What it can sound like, I want to get the house sorted out. Practical planning. What the person may need, Support to act on the decisions they have made themselves. What not to say, You are being so brave about it.</desc><defs><pattern id="lv-diagonal" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8 L8,0 M-2,2 L2,-2 M6,10 L10,6" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><pattern id="lv-dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.55"/><circle cx="6" cy="6" r="1.4" fill="#ffffff" opacity="0.55"/></pattern><pattern id="lv-horizontal" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,2 H8 M0,6 H8" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><pattern id="lv-vertical" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M2,0 V8 M6,0 V8" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><pattern id="lv-grid" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,4 H8 M4,0 V8" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><marker id="lv-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#000054"/></marker></defs><rect width="960" height="613.85" fill="#ffffff"/><text x="36" y="57" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="21" font-weight="bold" fill="#000054">Recognising the five grief responses in what someone says</text><text x="36" y="81.5" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="14.5" fill="#000054">Kübler-Ross named five responses. She did not claim people move through them in order, and most do not.</text><rect x="36" y="100.58" width="64" height="4" fill="#fac800"/><path d="M163,126.58 H405 A6,6 0 0 1 411,132.57 V162.15 A6,6 0 0 1 405,168.15 H163 A6,6 0 0 1 157,162.15 V132.57 A6,6 0 0 1 163,126.58 Z" fill="#000054"/><text x="284" y="152.07" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="14.5" font-weight="bold" fill="#ffffff" text-anchor="middle">What it can sound like</text><path d="M419,126.58 H661 A6,6 0 0 1 667,132.57 V162.15 A6,6 0 0 1 661,168.15 H419 A6,6 0 0 1 413,162.15 V132.57 A6,6 0 0 1 419,126.58 Z" fill="#00706b"/><text x="540" y="152.07" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="14.5" font-weight="bold" fill="#ffffff" text-anchor="middle">What the person may need</text><path d="M675,126.58 H917 A6,6 0 0 1 923,132.57 V162.15 A6,6 0 0 1 917,168.15 H675 A6,6 0 0 1 669,162.15 V132.57 A6,6 0 0 1 675,126.58 Z" fill="#a4177c"/><text x="796" y="152.07" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="14.5" font-weight="bold" fill="#ffffff" text-anchor="middle">What not to say</text><rect x="36" y="171.15" width="888" height="57.1" fill="#f3f3f3"/><text x="47" y="203.93" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" font-weight="bold" fill="#000054">Denial</text><text x="167" y="195.15" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">There has been a mistake. Get the tests</text><text x="167" y="212.7" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">done again.</text><line x1="412" y1="175.15" x2="412" y2="224.25" stroke="#d5d5dd" stroke-width="1"/><text x="423" y="195.15" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">Time, and the information offered again</text><text x="423" y="212.7" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">later rather than pressed now.</text><line x1="668" y1="175.15" x2="668" y2="224.25" stroke="#d5d5dd" stroke-width="1"/><text x="679" y="203.93" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">You need to accept this.</text><text x="47" y="261.02" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" font-weight="bold" fill="#000054">Anger</text><text x="167" y="252.25" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">Why did nobody pick this up sooner?</text><text x="167" y="269.8" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">Often aimed at whoever is in the room.</text><line x1="412" y1="232.25" x2="412" y2="281.35" stroke="#d5d5dd" stroke-width="1"/><text x="423" y="252.25" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">To be heard without the anger being</text><text x="423" y="269.8" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">taken personally or argued down.</text><line x1="668" y1="232.25" x2="668" y2="281.35" stroke="#d5d5dd" stroke-width="1"/><text x="679" y="261.02" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">There is no point getting angry about it.</text><rect x="36" y="285.35" width="888" height="74.65" fill="#f3f3f3"/><text x="47" y="326.9" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" font-weight="bold" fill="#000054">Bargaining</text><text x="167" y="318.13" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">If I do everything right, will that change</text><text x="167" y="335.68" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">it? Often carries what if and if only.</text><line x1="412" y1="289.35" x2="412" y2="356" stroke="#d5d5dd" stroke-width="1"/><text x="423" y="309.35" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">Honesty about what is and is not</text><text x="423" y="326.9" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">possible, given without stripping out</text><text x="423" y="344.45" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">hope.</text><line x1="668" y1="289.35" x2="668" y2="356" stroke="#d5d5dd" stroke-width="1"/><text x="679" y="318.13" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">That is not going to make any</text><text x="679" y="335.68" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">difference.</text><text x="47" y="401.55" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" font-weight="bold" fill="#000054">Depression</text><text x="167" y="392.78" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">Little talk. Withdrawal from things that</text><text x="167" y="410.33" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">used to matter.</text><line x1="412" y1="364" x2="412" y2="430.65" stroke="#d5d5dd" stroke-width="1"/><text x="423" y="384" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">Someone present rather than fixing it.</text><text x="423" y="401.55" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">Watch for risk and escalate to a</text><text x="423" y="419.1" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">supervisor.</text><line x1="668" y1="364" x2="668" y2="430.65" stroke="#d5d5dd" stroke-width="1"/><text x="679" y="401.55" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">Try to look on the bright side.</text><rect x="36" y="434.65" width="888" height="57.1" fill="#f3f3f3"/><text x="47" y="467.42" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" font-weight="bold" fill="#000054">Acceptance</text><text x="167" y="458.65" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">I want to get the house sorted out.</text><text x="167" y="476.2" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">Practical planning.</text><line x1="412" y1="438.65" x2="412" y2="487.75" stroke="#d5d5dd" stroke-width="1"/><text x="423" y="458.65" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">Support to act on the decisions they</text><text x="423" y="476.2" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">have made themselves.</text><line x1="668" y1="438.65" x2="668" y2="487.75" stroke="#d5d5dd" stroke-width="1"/><text x="679" y="467.42" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">You are being so brave about it.</text><line x1="36" y1="491.75" x2="924" y2="491.75" stroke="#000054" stroke-width="1.5"/><text x="36" y="521.25" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054">These are responses, not stages in a fixed order. A person can move between them, return to one they seemed to have left, or never show some of them at all. The order of</text><text x="36" y="536.78" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054">the rows here is the order Kübler-Ross listed them in, and nothing more. Treat a person who is angry in week one and angry again in week six as normal, not as having gone</text><text x="36" y="552.3" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054">backwards.</text><g opacity="0.75"><text x="36" y="573.83" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054">Source: Elisabeth Kübler-Ross, On Death and Dying, 1969. Generated for review, verify against your unit&apos;s prescribed text before use.</text></g></svg>