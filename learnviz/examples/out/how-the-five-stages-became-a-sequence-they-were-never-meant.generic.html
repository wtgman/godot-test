      <summary>Image description</summary>
      <p><strong>Main subject/content</strong>: How the five stages became a sequence they were never meant to be. A vertical timeline. Events run from earliest at the top to latest at the bottom, joined by a single vertical line.</p><ul><li>1969: On Death and Dying is published. Elisabeth Kübler-Ross describes five responses she observed while interviewing people who were dying. The subject is a person facing their own death, not a person grieving someone else&apos;s.</li><li>1970s and 1980s: The model is borrowed for bereavement. It spreads into bereavement care, training and popular culture, applied to grieving a death rather than facing one. It is also flattened into five numbered steps along the way.</li><li>2005: Kübler-Ross says plainly that they are not a sequence. In On Grief and Grieving, written with David Kessler, she states the responses are not stops on a linear timeline, that not everyone experiences all of them, and that they can recur.</li><li>2000s onward: The evidence does not find a fixed order. Studies of bereaved people repeatedly fail to find everyone moving through a set sequence. The most common pattern reported is resilience rather than progression through stages.</li><li>2019: A sixth response is proposed. David Kessler adds finding meaning, arguing the original five stop at acceptance and leave out what people do afterwards.</li><li>Now: The flattened version is still the one people arrive with. Most learners, and most families, meet grief as five stages in order. Expect to have to correct it, and expect a family to worry that someone is grieving wrongly because they are out of order.</li></ul><p><strong>Important visual details</strong>: Each event is a dot on the line. Turning points are drawn as a larger dot with a ring around it.</p><p><strong>Relevant structure such as columns, layers, or groupings</strong>: 6 events, in chronological order. Each has a date, a heading, and a short explanation to the right of the line.</p><p><strong>Colours/layout</strong>: Drawn in the RMIT palette on a white background, with navy #000054 text. Accent colours in use: navy, teal, magenta, ochre, blue, rust. No information is carried by colour alone. Every coloured element also carries a number, a label or a texture, so nothing is lost in greyscale or by a learner with colour vision deficiency.</p><p><strong>Visible text</strong></p><ul><li>1969</li><li>On Death and Dying is published</li><li>1970s and 1980s</li><li>The model is borrowed for bereavement</li><li>2005</li><li>Kübler-Ross says plainly that they are not a sequence</li><li>2000s onward</li><li>The evidence does not find a fixed order</li><li>2019</li><li>A sixth response is proposed</li><li>Now</li><li>The flattened version is still the one people arrive with</li></ul>
