<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 754.65" width="960" height="754.65" role="img" aria-labelledby="lv-title lv-desc" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif"><title id="lv-title">A vertical timeline. Events run from earliest at the top to latest at the bottom, joined by a single vertical line titled &quot;The rise of Instagram&quot;.</title><desc id="lv-desc">A vertical timeline. Events run from earliest at the top to latest at the bottom, joined by a single vertical line. 7 events, in chronological order. Each has a date, a heading, and a short explanation to the right of the line. October 2010: Launch, iPhone only. Photo sharing with filters, built for slow mobile connections. Twenty five thousand users on the first day. April 2012: Acquired by Facebook for one billion US dollars. Thirteen employees, no revenue. The price was for the audience and the threat it posed. June 2013: Video arrives. Fifteen second clips, a direct answer to Vine. August 2016: Stories launches. Twenty four hour posts, copied openly from Snapchat. Within two years Stories had more daily users than Snapchat entirely. June 2018: IGTV and one billion users. A push into long form video that never found an audience and was retired in 2022. August 2020: Reels launches. Short vertical video, answering TikTok. The feed shifts from people you follow to what the algorithm picks. 2023 to 2025: Recommendation first. Most of what a user sees comes from accounts they do not follow. The product is now closer to television than to a friend list.</desc><defs><pattern id="lv-diagonal" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8 L8,0 M-2,2 L2,-2 M6,10 L10,6" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><pattern id="lv-dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.55"/><circle cx="6" cy="6" r="1.4" fill="#ffffff" opacity="0.55"/></pattern><pattern id="lv-horizontal" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,2 H8 M0,6 H8" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><pattern id="lv-vertical" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M2,0 V8 M6,0 V8" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><pattern id="lv-grid" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,4 H8 M4,0 V8" stroke="#ffffff" stroke-width="1.6" opacity="0.55" fill="none"/></pattern><marker id="lv-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#000054"/></marker></defs><rect width="960" height="754.65" fill="#ffffff"/><text x="36" y="57" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="21" font-weight="bold" fill="#000054">The rise of Instagram</text><text x="36" y="81.5" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="14.5" fill="#000054">Each turning point is a response to a competitor or a change in how people used their phones.</text><rect x="36" y="100.58" width="64" height="4" fill="#fac800"/><line x1="44" y1="139.48" x2="44" y2="635.37" stroke="#d5d5dd" stroke-width="3" stroke-linecap="round"/><circle cx="44" cy="139.48" r="10" fill="#ffffff"/><circle cx="44" cy="139.48" r="7" fill="#000054"/><text x="78" y="144.07" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" font-weight="bold" fill="#00706b">October 2010</text><text x="78" y="159.6" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="14.5" font-weight="bold" fill="#000054">Launch, iPhone only</text><text x="78" y="183.18" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">Photo sharing with filters, built for slow mobile connections. Twenty five thousand users on the first day.</text><circle cx="44" cy="222.13" r="14" fill="#ffffff"/><circle cx="44" cy="222.13" r="11" fill="#a4177c"/><circle cx="44" cy="222.13" r="15.5" fill="none" stroke="#a4177c" stroke-width="1.5" opacity="0.5"/><text x="78" y="226.73" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" font-weight="bold" fill="#00706b">April 2012</text><text x="78" y="242.25" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="14.5" font-weight="bold" fill="#000054">Acquired by Facebook for one billion US dollars</text><text x="78" y="265.83" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">Thirteen employees, no revenue. The price was for the audience and the threat it posed.</text><circle cx="44" cy="304.77" r="10" fill="#ffffff"/><circle cx="44" cy="304.77" r="7" fill="#000054"/><text x="78" y="309.38" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" font-weight="bold" fill="#00706b">June 2013</text><text x="78" y="324.9" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="14.5" font-weight="bold" fill="#000054">Video arrives</text><text x="78" y="348.48" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">Fifteen second clips, a direct answer to Vine.</text><circle cx="44" cy="387.42" r="14" fill="#ffffff"/><circle cx="44" cy="387.42" r="11" fill="#a4177c"/><circle cx="44" cy="387.42" r="15.5" fill="none" stroke="#a4177c" stroke-width="1.5" opacity="0.5"/><text x="78" y="392.03" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" font-weight="bold" fill="#00706b">August 2016</text><text x="78" y="407.55" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="14.5" font-weight="bold" fill="#000054">Stories launches</text><text x="78" y="431.12" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">Twenty four hour posts, copied openly from Snapchat. Within two years Stories had more daily users than Snapchat entirely.</text><circle cx="44" cy="470.07" r="10" fill="#ffffff"/><circle cx="44" cy="470.07" r="7" fill="#000054"/><text x="78" y="474.67" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" font-weight="bold" fill="#00706b">June 2018</text><text x="78" y="490.2" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="14.5" font-weight="bold" fill="#000054">IGTV and one billion users</text><text x="78" y="513.77" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">A push into long form video that never found an audience and was retired in 2022.</text><circle cx="44" cy="552.72" r="14" fill="#ffffff"/><circle cx="44" cy="552.72" r="11" fill="#a4177c"/><circle cx="44" cy="552.72" r="15.5" fill="none" stroke="#a4177c" stroke-width="1.5" opacity="0.5"/><text x="78" y="557.32" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" font-weight="bold" fill="#00706b">August 2020</text><text x="78" y="572.85" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="14.5" font-weight="bold" fill="#000054">Reels launches</text><text x="78" y="596.42" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">Short vertical video, answering TikTok. The feed shifts from people you follow to what the algorithm picks.</text><circle cx="44" cy="635.37" r="10" fill="#ffffff"/><circle cx="44" cy="635.37" r="7" fill="#000054"/><text x="78" y="639.97" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" font-weight="bold" fill="#00706b">2023 to 2025</text><text x="78" y="655.5" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="14.5" font-weight="bold" fill="#000054">Recommendation first</text><text x="78" y="679.08" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="13" fill="#000054">Most of what a user sees comes from accounts they do not follow. The product is now closer to television than to a friend list.</text><g opacity="0.75"><text x="36" y="714.62" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="11.5" fill="#000054">Source: Compiled from company announcements and press releases.</text></g></svg>